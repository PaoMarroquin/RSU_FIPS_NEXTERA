# Único servicio expuesto: termina HTTPS, sirve el frontend y enruta /api al backend.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado emitido por la OTI (montado desde ./certs).
    ssl_certificate     /etc/nginx/certs/certificado.crt;
    ssl_certificate_key /etc/nginx/certs/certificado.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend (aplicación de una sola página).
    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }

    # Administración y documentación de la API: solo red institucional o VPN.
    location /admin/ {
        include /etc/nginx/red-institucional.conf;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy-cabeceras.inc;
    }
    location ~ ^/api/v1/(docs|redoc|schema)/ {
        include /etc/nginx/red-institucional.conf;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy-cabeceras.inc;
    }

    # API.
    location /api/ {
        proxy_pass http://backend;
        proxy_read_timeout 120s;
        include /etc/nginx/conf.d/proxy-cabeceras.inc;
    }

    # Archivos estáticos del admin (collectstatic).
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # Archivos subidos: el backend valida la URL firmada y responde con
    # X-Accel-Redirect; Nginx los entrega desde la ubicación interna.
    location /media/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy-cabeceras.inc;
    }
    location /media-protegido/ {
        internal;
        alias /srv/media/;
    }
}
