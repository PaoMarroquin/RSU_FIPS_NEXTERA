# Despliegue de producción (servidor de la OTI).
# Uso, desde la carpeta deploy/:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Solo Nginx publica puertos (80 y 443). PostgreSQL y el backend quedan en la red interna.

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "False"
      MEDIA_ROOT: /app/media
      MEDIA_X_ACCEL: "True"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_URL: ${URL_PUBLICA}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/srv/static:ro
      - media:/srv/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media:
  static:
